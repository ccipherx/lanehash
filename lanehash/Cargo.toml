[package]
name = "lanehash"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
publish = true
license = "MIT OR Apache-2.0"
description = "Fast, high-quality 64/128-bit non-cryptographic hashing without AES, plus an AES-lane variant; one definition on every backend"
repository = "https://github.com/ccipherx/lanehash"
homepage = "https://github.com/ccipherx/lanehash"
keywords = ["hash", "hasher", "no-std", "simd", "lanehash"]
categories = ["algorithms", "no-std"]
include = ["src/**/*", "tests/**/*", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["std"]
std = []
force-fallback = []


[dev-dependencies]
libc = "0.2"