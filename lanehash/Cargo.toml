[package]
name = "lanehash"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = true
license = "MIT OR Apache-2.0"
description = "The fastest non-cryptographic, highest quality hash algorithm"
repository = "https://github.com/ccipherx/lanehash"
homepage = "https://github.com/ccipherx/lanehash"
keywords = ["hash", "hasher", "no-std", "lanehash"]
categories = ["algorithms", "no-std"]
include = ["src/**/*", "tests/**/*", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["std"]
std = []
force-fallback = []


[dev-dependencies]
libc = "0.2"