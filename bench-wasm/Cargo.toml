[package]
name = "bench-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lanehash = { path = "../lanehash", default-features = false }
rapidhash = { version = "4.5.1", default-features = false }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
wasm-bindgen = "0.2"
